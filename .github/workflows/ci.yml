name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todo-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: todo-backend

      - name: Run tests
        run: npm test -- --runInBand
        working-directory: todo-backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: todo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: todo-frontend

      - name: Run tests
        run: npm test -- --watchAll=false
        working-directory: todo-frontend
        env:
          CI: true

      - name: Build application
        run: npm run build
        working-directory: todo-frontend
        env:
          CI: true
